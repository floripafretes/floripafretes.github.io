name: Atualizar avaliações do Google
on:
  schedule:
    - cron: "0 9,21 * * *"   # 6h e 18h (horário de Brasília)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/atualizar-avaliacoes.mjs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add avaliacoes.json
          git diff --cached --quiet || (git commit -m "Atualiza avaliações do Google" && git push)
